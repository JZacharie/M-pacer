name: Publication de l'image

# Publie l'image sur ghcr.io avec le GITHUB_TOKEN du depot, qui possede
# nativement la permission packages: write : aucun PAT n'est necessaire.

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Etiquette supplementaire a publier, sans prefixe v (ex. 0.2.0)"
        required: false

permissions:
  contents: read
  packages: write

env:
  ACTIONS_RUNNER_FORCE_NODE24: "true"

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Connexion a ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Etiquettes
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/mpacer
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=short
            type=ref,event=tag
            # v0.2.0 -> 0.2.0 : c'est le tag que le chart utilise par defaut
            # (image.tag vide => appVersion du chart).
            type=semver,pattern={{version}}
            # Relance manuelle : meme etiquette, pour un tag deja publie.
            type=raw,value=${{ inputs.version }},enable=${{ inputs.version != '' }}

      - name: Construction et publication
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

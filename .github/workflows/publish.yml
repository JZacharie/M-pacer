name: Publication de l'image

# Publie l'image sur ghcr.io avec le GITHUB_TOKEN du depot, qui possede
# nativement la permission packages: write : aucun PAT n'est necessaire.

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Etiquette supplementaire a publier, sans prefixe v (ex. 0.2.0)"
        required: false

permissions:
  contents: read
  packages: write

env:
  ACTIONS_RUNNER_FORCE_NODE24: "true"

# Les executions s'enchainent, sans annulation : deux publications simultanees
# ne doivent pas se marcher dessus quand le tag epingle est mis a jour.
concurrency:
  group: publish-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Connexion a ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Etiquettes
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/mpacer
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=short
            type=ref,event=tag
            # v0.2.0 -> 0.2.0 : c'est le tag que le chart utilise par defaut
            # (image.tag vide => appVersion du chart).
            type=semver,pattern={{version}}
            # Relance manuelle : meme etiquette, pour un tag deja publie.
            type=raw,value=${{ inputs.version }},enable=${{ inputs.version != '' }}

      - name: Construction et publication
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Le cluster jo3 execute exactement l'etiquette ecrite dans
  # charts/mpacer/values-jo3.yaml. Un nom de tag qui ne change pas (« latest »)
  # ne modifie aucun manifeste : ArgoCD reste « Synced » sur la revision
  # precedente et le site continue de servir une image ancienne. Ce job epingle
  # donc le sha du commit publie : le fichier de valeurs change a chaque
  # publication, ArgoCD synchronise et le pod redemarre sur l'image exacte.
  epinglage:
    name: Epinglage de l'image deployee
    needs: image
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: "Ecrire tag: sha-<court> dans values-jo3.yaml"
        shell: bash
        env:
          SHA_PUBLIE: ${{ github.sha }}
        run: |
          set -euo pipefail
          court="${SHA_PUBLIE:0:7}"
          fichier="charts/mpacer/values-jo3.yaml"
          lignes_avant="$(wc -l < "$fichier")"
          sed -i -E "s|^  tag: .*$|  tag: sha-${court}|" "$fichier"
          # Garde-fous : la substitution ne doit toucher qu'une seule ligne.
          test "$(wc -l < "$fichier")" = "$lignes_avant"
          test "$(grep -c "^  tag: sha-${court}$" "$fichier")" = "1"
          if git diff --quiet -- "$fichier"; then
            echo "values-jo3.yaml pointe deja sur sha-${court} : rien a publier."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$fichier"
          git commit -m "chore(deploy): image jo3 sha-${court} [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main

name: Publication de l'image

# Publie l'image sur ghcr.io avec le GITHUB_TOKEN du depot, qui possede
# nativement la permission packages: write : aucun PAT n'est necessaire.

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Etiquette supplementaire a publier, sans prefixe v (ex. 0.2.0)"
        required: false

permissions:
  contents: read
  packages: write

env:
  ACTIONS_RUNNER_FORCE_NODE24: "true"

# Les executions s'enchainent, sans annulation : deux publications simultanees
# ne doivent pas se marcher dessus quand le tag epingle est mis a jour.
concurrency:
  group: publish-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    outputs:
      # Empreinte de l'image publiee, reportee dans values-jo3.yaml par le job
      # « redeploiement » ci-dessous.
      digest: ${{ steps.image.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Connexion a ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Etiquettes
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/mpacer
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=short
            type=ref,event=tag
            # v0.2.0 -> 0.2.0 : c'est le tag que le chart utilise par defaut
            # (image.tag vide => appVersion du chart).
            type=semver,pattern={{version}}
            # Relance manuelle : meme etiquette, pour un tag deja publie.
            type=raw,value=${{ inputs.version }},enable=${{ inputs.version != '' }}

      - name: Construction et publication
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ArgoCD ne redeploie que si le rendu Helm change. Le tag « latest » garde le
  # meme nom d'une publication a l'autre : publier une nouvelle image ne suffit
  # donc pas, le cluster continue de servir l'ancienne (incident du 9 octobre
  # 2026 : 3 jours de retard alors que 7 images avaient ete publiees).
  #
  # Ce job ecrit l'empreinte exacte de l'image publiee dans une annotation du
  # pod, valide le rendu du chart, puis engage la modification. Le rendu change
  # a chaque publication : ArgoCD synchronise, le pod redemarre et le kubelet
  # re-tire « latest ».
  redeploiement:
    name: Redeclenchement du deploiement (values-jo3.yaml)
    needs: image
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4

      - name: "Ecrire l'empreinte de l'image dans values-jo3.yaml"
        shell: bash
        env:
          SHA_PUBLIE: ${{ github.sha }}
          EMPREINTE: ${{ needs.image.outputs.digest }}
        run: |
          set -euo pipefail
          court="${SHA_PUBLIE:0:7}"
          fichier="charts/mpacer/values-jo3.yaml"
          if [ -z "$EMPREINTE" ]; then
            echo "Empreinte d'image absente : rien n'a ete publie." >&2
            exit 1
          fi
          lignes_avant="$(wc -l < "$fichier")"
          sed -i -E "s|^(  mpacer\.zacharie\.org/image-publiee:).*|\1 \"sha-${court}@${EMPREINTE}\"|" "$fichier"
          # Garde-fous : une seule ligne touchee, valeur bien ecrite.
          test "$(wc -l < "$fichier")" = "$lignes_avant"
          test "$(grep -c "^  mpacer.zacharie.org/image-publiee: \"sha-${court}@sha256:" "$fichier")" = "1"

      - name: Verifier le rendu du chart
        run: |
          helm lint charts/mpacer -f charts/mpacer/values-jo3.yaml
          helm template mpacer charts/mpacer -n mpacer -f charts/mpacer/values-jo3.yaml > /dev/null

      - name: Engager l'epingle
        shell: bash
        env:
          SHA_PUBLIE: ${{ github.sha }}
        run: |
          set -euo pipefail
          court="${SHA_PUBLIE:0:7}"
          fichier="charts/mpacer/values-jo3.yaml"
          if git diff --quiet -- "$fichier"; then
            echo "values-jo3.yaml porte deja l'image sha-${court} : rien a publier."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$fichier"
          git commit -m "chore(deploy): image latest sha-${court} [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main

# Reglages Gradle communs aux deux modules.
# La compilation du coeur Rust (cargo-ndk) est branchee sur :app:preBuild ;
# voir android/README.md (et -Pmpacer.buildRust=false pour reutiliser des .so deja construits).
# 32 threads / 93 Go sur le poste de dev : un gros tas evite les GC pendant
# l'assemblage Compose, et la veille de systeme de fichiers accelere les
# reconstructions incrementales (Windows uniquement, sans effet ailleurs).
org.gradle.jvmargs=-Xmx6144m -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.vfs.watch=true
kotlin.daemon.jvmargs=-Xmx3072m

# NE PAS activer org.gradle.configuration-cache : la tache :core:cargoNdkBuild
# (type Exec) capture des references de script et n'est pas serialisable ;
# Gradle 8.11.1 fait alors echouer le build (verifie le 2026-10-09).

# AndroidX obligatoire (Compose, Security, Wear)
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin
kotlin.code.style=official

# Le SDK Android est local a la machine : definir ANDROID_HOME ou android/local.properties
# (fichier ignore par git). Aucun chemin n'est versionne ici.

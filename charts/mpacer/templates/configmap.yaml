apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "mpacer.fullname" . }}
  labels:
    {{- include "mpacer.labels" . | nindent 4 }}
data:
  MPACER_ENV: {{ .Values.config.environment | quote }}
  MPACER_BIND: {{ printf "0.0.0.0:%v" .Values.service.port | quote }}
  MPACER_PUBLIC_URL: {{ .Values.config.publicUrl | quote }}
  MPACER_COOKIE_SECURE: {{ .Values.config.cookieSecure | quote }}
  MPACER_DEV_AUTH: {{ .Values.config.devAuth | quote }}
  {{- if .Values.config.googleRedirectUri }}
  # Doit correspondre EXACTEMENT a une URI autorisee dans la console Google
  MPACER_GOOGLE_REDIRECT_URI: {{ .Values.config.googleRedirectUri | quote }}
  {{- end }}
  {{- if .Values.config.spotifyRedirectUri }}
  # Doit correspondre EXACTEMENT a une URI autorisee dans la console Spotify
  MPACER_SPOTIFY_REDIRECT_URI: {{ .Values.config.spotifyRedirectUri | quote }}
  {{- end }}
  {{- if .Values.config.mqttUrl }}
  # Suivi en direct : positions publiees par la montre pendant la seance.
  MPACER_MQTT_URL: {{ .Values.config.mqttUrl | quote }}
  MPACER_MQTT_TOPIC: {{ .Values.config.mqttTopic | quote }}
  {{- if .Values.config.mqttUsername }}
  MPACER_MQTT_USERNAME: {{ .Values.config.mqttUsername | quote }}
  {{- end }}
  {{- end }}
  RUST_LOG: {{ .Values.config.rustLog | quote }}

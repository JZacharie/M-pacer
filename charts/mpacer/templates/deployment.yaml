apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mpacer.fullname" . }}
  labels:
    {{- include "mpacer.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: 3
  strategy:
    {{- toYaml .Values.strategy | nindent 4 }}
  selector:
    matchLabels:
      {{- include "mpacer.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        # Redemarre le pod quand la configuration change
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "mpacer.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "mpacer.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: mpacer
          image: {{ include "mpacer.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "mpacer.fullname" . }}
            - secretRef:
                name: {{ include "mpacer.secretName" . }}
          env:
            {{- if eq .Values.postgresql.mode "cnpg" }}
            # Le secret applicatif CloudNativePG fournit host/port/dbname/username/password
            - name: MPACER_DB_HOST
              valueFrom:
                secretKeyRef:
                  name: {{ include "mpacer.postgresAppSecret" . }}
                  key: host
            - name: MPACER_DB_PORT
              valueFrom:
                secretKeyRef:
                  name: {{ include "mpacer.postgresAppSecret" . }}
                  key: port
            - name: MPACER_DB_NAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "mpacer.postgresAppSecret" . }}
                  key: dbname
            - name: MPACER_DB_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "mpacer.postgresAppSecret" . }}
                  key: username
            - name: MPACER_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "mpacer.postgresAppSecret" . }}
                  key: password
            - name: MPACER_DB_SSLMODE
              value: "disable"
            {{- else if eq .Values.postgresql.mode "external" }}
            - name: MPACER_DB_HOST
              value: {{ required "postgresql.external.host est obligatoire en mode external" .Values.postgresql.external.host | quote }}
            - name: MPACER_DB_PORT
              value: {{ .Values.postgresql.external.port | quote }}
            - name: MPACER_DB_NAME
              value: {{ .Values.postgresql.external.database | quote }}
            - name: MPACER_DB_USER
              value: {{ .Values.postgresql.external.username | quote }}
            - name: MPACER_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ required "postgresql.external.existingSecret est obligatoire en mode external" .Values.postgresql.external.existingSecret }}
                  key: password
            - name: MPACER_DB_SSLMODE
              value: {{ .Values.postgresql.external.sslmode | quote }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- if .Values.livenessProbe.enabled }}
          livenessProbe:
            httpGet:
              path: {{ .Values.livenessProbe.path }}
              port: http
            initialDelaySeconds: {{ .Values.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.livenessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.livenessProbe.failureThreshold }}
          {{- end }}
          {{- if .Values.readinessProbe.enabled }}
          readinessProbe:
            httpGet:
              path: {{ .Values.readinessProbe.path }}
              port: http
            initialDelaySeconds: {{ .Values.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.readinessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.readinessProbe.failureThreshold }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            {{- if .Values.persistence.enabled }}
            - name: data
              mountPath: {{ .Values.persistence.mountPath }}
            {{- else }}
            # Racine en lecture seule : la musique televersee a besoin d'un volume
            # inscriptible meme sans persistance (fichiers perdus au remplacement du pod).
            - name: media
              mountPath: {{ .Values.config.mediaDir }}
            {{- end }}
            # Systeme de fichiers racine en lecture seule : /tmp est un emptyDir
            - name: tmp
              mountPath: /tmp
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        {{- if .Values.persistence.enabled }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "mpacer.fullname" . }}
        {{- else }}
        - name: media
          emptyDir: {}
        {{- end }}
        - name: tmp
          emptyDir: {}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}

{{- if .Values.externalSecrets.enabled }}
{{- if eq .Values.postgresql.mode "cnpg" }}
# Rien a faire pour PostgreSQL : CloudNativePG genere lui-meme son secret applicatif.
{{- end }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.externalSecrets.secretName }}
  labels:
    {{- include "mpacer.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStore }}
    kind: ClusterSecretStore
  target:
    name: {{ .Values.externalSecrets.secretName }}
    creationPolicy: Owner
  data:
    - secretKey: {{ .Values.externalSecrets.keys.sessionSecret }}
      remoteRef:
        key: {{ .Values.externalSecrets.vaultPath }}
        property: {{ .Values.externalSecrets.keys.sessionSecret }}
    - secretKey: {{ .Values.externalSecrets.keys.googleClientId }}
      remoteRef:
        key: {{ .Values.externalSecrets.vaultPath }}
        property: {{ .Values.externalSecrets.keys.googleClientId }}
    - secretKey: {{ .Values.externalSecrets.keys.googleClientSecret }}
      remoteRef:
        key: {{ .Values.externalSecrets.vaultPath }}
        property: {{ .Values.externalSecrets.keys.googleClientSecret }}
    {{- if .Values.externalSecrets.keys.deezerAppId }}
    - secretKey: {{ .Values.externalSecrets.keys.deezerAppId }}
      remoteRef:
        key: {{ .Values.externalSecrets.vaultPath }}
        property: {{ .Values.externalSecrets.keys.deezerAppId }}
    {{- end }}
    {{- if .Values.externalSecrets.keys.deezerAppSecret }}
    - secretKey: {{ .Values.externalSecrets.keys.deezerAppSecret }}
      remoteRef:
        key: {{ .Values.externalSecrets.vaultPath }}
        property: {{ .Values.externalSecrets.keys.deezerAppSecret }}
    {{- end }}
    {{- if .Values.externalSecrets.keys.deezerArl }}
    # Deezer par cookie arl : lecture des playlists sans application developpeur.
    - secretKey: {{ .Values.externalSecrets.keys.deezerArl }}
      remoteRef:
        key: {{ .Values.externalSecrets.vaultPath }}
        property: {{ .Values.externalSecrets.keys.deezerArl }}
    {{- end }}
    {{- if .Values.externalSecrets.keys.deemixUser }}
    # Instance Deemix : authentification basique (Traefik), pour mettre les MP3
    # en file depuis /music.
    - secretKey: {{ .Values.externalSecrets.keys.deemixUser }}
      remoteRef:
        key: {{ .Values.externalSecrets.vaultPath }}
        property: {{ .Values.externalSecrets.keys.deemixUser }}
    {{- end }}
    {{- if .Values.externalSecrets.keys.deemixPassword }}
    - secretKey: {{ .Values.externalSecrets.keys.deemixPassword }}
      remoteRef:
        key: {{ .Values.externalSecrets.vaultPath }}
        property: {{ .Values.externalSecrets.keys.deemixPassword }}
    {{- end }}
    {{- if .Values.externalSecrets.keys.mqttPassword }}
    # Suivi en direct : mot de passe du broker MQTT (docs/10), optionnel.
    - secretKey: {{ .Values.externalSecrets.keys.mqttPassword }}
      remoteRef:
        key: {{ .Values.externalSecrets.vaultPath }}
        property: {{ .Values.externalSecrets.keys.mqttPassword }}
    {{- end }}
{{- end }}

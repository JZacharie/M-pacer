{{- if .Values.externalSecrets.enabled }}
{{- if eq .Values.postgresql.mode "cnpg" }}
# Rien a faire pour PostgreSQL : CloudNativePG genere lui-meme son secret applicatif.
{{- end }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.externalSecrets.secretName }}
  labels:
    {{- include "mpacer.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStore }}
    kind: ClusterSecretStore
  target:
    name: {{ .Values.externalSecrets.secretName }}
    creationPolicy: Owner
  data:
    - secretKey: {{ .Values.externalSecrets.keys.sessionSecret }}
      remoteRef:
        key: {{ .Values.externalSecrets.vaultPath }}
        property: {{ .Values.externalSecrets.keys.sessionSecret }}
    - secretKey: {{ .Values.externalSecrets.keys.googleClientId }}
      remoteRef:
        key: {{ .Values.externalSecrets.vaultPath }}
        property: {{ .Values.externalSecrets.keys.googleClientId }}
    - secretKey: {{ .Values.externalSecrets.keys.googleClientSecret }}
      remoteRef:
        key: {{ .Values.externalSecrets.vaultPath }}
        property: {{ .Values.externalSecrets.keys.googleClientSecret }}
    {{- if .Values.externalSecrets.keys.spotifyClientId }}
    - secretKey: {{ .Values.externalSecrets.keys.spotifyClientId }}
      remoteRef:
        key: {{ .Values.externalSecrets.vaultPath }}
        property: {{ .Values.externalSecrets.keys.spotifyClientId }}
    {{- end }}
    {{- if .Values.externalSecrets.keys.spotifyClientSecret }}
    - secretKey: {{ .Values.externalSecrets.keys.spotifyClientSecret }}
      remoteRef:
        key: {{ .Values.externalSecrets.vaultPath }}
        property: {{ .Values.externalSecrets.keys.spotifyClientSecret }}
    {{- end }}
{{- end }}

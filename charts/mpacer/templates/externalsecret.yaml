{{- if .Values.externalSecrets.enabled }}
{{- if eq .Values.postgresql.mode "cnpg" }}
# Rien a faire pour PostgreSQL : CloudNativePG genere lui-meme son secret applicatif.
{{- end }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.externalSecrets.secretName }}
  labels:
    {{- include "mpacer.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStore }}
    kind: ClusterSecretStore
  target:
    name: {{ .Values.externalSecrets.secretName }}
    creationPolicy: Owner
  data:
    - secretKey: {{ .Values.externalSecrets.keys.sessionSecret }}
      remoteRef:
        key: {{ .Values.externalSecrets.vaultPath }}
        property: {{ .Values.externalSecrets.keys.sessionSecret }}
    - secretKey: {{ .Values.externalSecrets.keys.googleClientId }}
      remoteRef:
        key: {{ .Values.externalSecrets.vaultPath }}
        property: {{ .Values.externalSecrets.keys.googleClientId }}
    - secretKey: {{ .Values.externalSecrets.keys.googleClientSecret }}
      remoteRef:
        key: {{ .Values.externalSecrets.vaultPath }}
        property: {{ .Values.externalSecrets.keys.googleClientSecret }}
{{- if .Values.externalSecrets.regcred.enabled }}
---
# Identifiant de tirage d'image, synchronise depuis Vault comme sur le reste du cluster
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.externalSecrets.regcred.secretName }}
  labels:
    {{- include "mpacer.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.regcred.secretStore }}
    kind: ClusterSecretStore
  target:
    name: {{ .Values.externalSecrets.regcred.secretName }}
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
  data:
    - secretKey: .dockerconfigjson
      remoteRef:
        key: {{ .Values.externalSecrets.regcred.key }}
        property: .dockerconfigjson
{{- end }}
{{- end }}

{{- if not .Values.auth.existingSecret }}
{{- $name := include "mpacer.secretName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $session := .Values.auth.sessionSecret }}
{{- if and (not $session) $existing (hasKey $existing.data "MPACER_SESSION_SECRET") }}
{{- $session = index $existing.data "MPACER_SESSION_SECRET" | b64dec }}
{{- end }}
{{- if not $session }}
{{- $session = randAlphaNum 48 }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "mpacer.labels" . | nindent 4 }}
  annotations:
    # Conserve le secret de session entre les upgrades
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  MPACER_SESSION_SECRET: {{ $session | quote }}
  MPACER_GOOGLE_CLIENT_ID: {{ .Values.auth.googleClientId | quote }}
  MPACER_GOOGLE_CLIENT_SECRET: {{ .Values.auth.googleClientSecret | quote }}
  {{- if .Values.auth.spotifyClientId }}
  MPACER_SPOTIFY_CLIENT_ID: {{ .Values.auth.spotifyClientId | quote }}
  {{- end }}
  {{- if .Values.auth.spotifyClientSecret }}
  MPACER_SPOTIFY_CLIENT_SECRET: {{ .Values.auth.spotifyClientSecret | quote }}
  {{- end }}
  {{- if .Values.auth.deezerAppId }}
  MPACER_DEEZER_APP_ID: {{ .Values.auth.deezerAppId | quote }}
  {{- end }}
  {{- if .Values.auth.deezerAppSecret }}
  MPACER_DEEZER_APP_SECRET: {{ .Values.auth.deezerAppSecret | quote }}
  {{- end }}
  {{- if .Values.auth.deezerArl }}
  MPACER_DEEZER_ARL: {{ .Values.auth.deezerArl | quote }}
  {{- end }}
  {{- if .Values.auth.mqttPassword }}
  MPACER_MQTT_PASSWORD: {{ .Values.auth.mqttPassword | quote }}
  {{- end }}
{{- end }}

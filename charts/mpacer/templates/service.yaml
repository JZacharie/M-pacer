apiVersion: v1
kind: Service
metadata:
  name: {{ include "mpacer.fullname" . }}
  labels:
    {{- include "mpacer.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
    {{- if .Values.metrics.enabled }}
    # Port dedie au scrape Prometheus : le conteneur n'ecoute qu'un seul port
    # (http), ce nom permet au ServiceMonitor de viser /metrics explicitement.
    - name: metrics
      port: {{ .Values.metrics.port }}
      targetPort: http
      protocol: TCP
    {{- end }}
  selector:
    {{- include "mpacer.selectorLabels" . | nindent 4 }}

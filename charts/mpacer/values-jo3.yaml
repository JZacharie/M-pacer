# Valeurs pour le cluster k3s "jo3" (label de noeud : cluster=jo3).
#   helm upgrade --install mpacer charts/mpacer -n mpacer --create-namespace \
#     -f charts/mpacer/values-jo3.yaml \
#     --set auth.googleClientId=... --set auth.googleClientSecret=...

image:
  repository: ghcr.io/jzacharie/mpacer
  tag: latest
  pullPolicy: Always

imagePullSecrets:
  - name: regcred

# Noeuds amd64 (vm15x/vm16x) : le cluster compte aussi des noeuds arm64 (pi20x).
nodeSelector:
  kubernetes.io/arch: amd64

service:
  port: 8080

# Secrets geres dans Vault et synchronises par l'External Secrets Operator :
#   vault kv put apps/mpacer \
#     MPACER_SESSION_SECRET="$(openssl rand -base64 48)" \
#     MPACER_GOOGLE_CLIENT_ID="....apps.googleusercontent.com" \
#     MPACER_GOOGLE_CLIENT_SECRET="GOCSPX-...."
externalSecrets:
  enabled: true
  # Le ClusterSecretStore 'vault-apps' pointe sur le MONTAGE Vault 'apps/'
  # (verifie sur jo3) : la cle est donc simplement le chemin dans ce montage.
  secretStore: vault-apps
  vaultPath: mpacer
  secretName: mpacer-secrets

# Le chart ne cree pas de Secret : il consomme celui produit par ESO
auth:
  existingSecret: mpacer-secrets

config:
  environment: production
  # Doit correspondre a l'URL de redirection declaree dans la console Google :
  #   https://mpacer.p.zacharie.org/auth/google/callback
  publicUrl: https://mpacer.p.zacharie.org
  cookieSecure: true
  devAuth: false
  # La console Google autorise https://mpacer.p.zacharie.org/auth/google/callback
  # (verifie le 6 octobre 2026) : c'est le chemin par defaut de l'application.
  googleRedirectUri: ""
  # Spotify (optionnel) : renseigner apres avoir scelle les identifiants dans
  # Vault (voir deploy/GITOPS-ET-SECRETS.md section 2) et declare l'URI de
  # redirection https://mpacer.p.zacharie.org/auth/spotify/callback
  # dans la console Spotify for Developers.
  mediaDir: /data/media
  spotifyRedirectUri: ""

# PostgreSQL gere par l'operateur CloudNativePG (present sur jo3 : cnpg-system)
postgresql:
  enabled: true
  mode: cnpg
  instances: 1
  database: mpacer
  username: mpacer
  storage:
    size: 2Gi
    # Conserve le volume si le cluster est supprime (donnees de sante personnelles)
    storageClass: local-path-retain
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi
  nodeSelector:
    kubernetes.io/arch: amd64

# Volume applicatif : il porte les fichiers audio televerses (/data/media).
# Le PVC doit rester monte, sinon les fichiers seraient perdus a chaque
# remplacement de pod (emptyDir).
persistence:
  enabled: true
  storageClass: local-path-retain
  size: 5Gi
  mountPath: /data

# Avec PostgreSQL, l'application est sans etat : mise a jour sans coupure
strategy:
  type: RollingUpdate

ingress:
  enabled: true
  className: traefik
  host: mpacer.p.zacharie.org

# Passer a true pour exposer le service publiquement (montre hors du domicile).
cloudflareIngress:
  enabled: false
  className: cloudflare-tunnel
  host: mpacer.zacharie.org

certificate:
  enabled: true
  issuerRef:
    name: letsencrypt-production-dns
    kind: ClusterIssuer

resources:
  requests:
    cpu: 25m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

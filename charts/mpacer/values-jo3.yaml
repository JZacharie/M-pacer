# Valeurs pour le cluster k3s "jo3" (label de noeud : cluster=jo3).
#   helm upgrade --install mpacer charts/mpacer -n mpacer --create-namespace \
#     -f charts/mpacer/values-jo3.yaml \
#     --set auth.googleClientId=... --set auth.googleClientSecret=...

image:
  repository: ghcr.io/jzacharie/mpacer
  # « latest » : le pod tire la derniere image publiee sur main (pullPolicy
  # Always), donc le binaire servi suit la CI sans changer de nom d'etiquette.
  tag: latest
  pullPolicy: Always

# Empreinte exacte de la derniere image publiee sur main, reecrite ici par le
# job « redeploiement » de .github/workflows/publish.yml, puis engagee dans Git.
#
# Pourquoi cette annotation : ArgoCD ne redeploie que si le rendu Helm change.
# Un tag « latest » garde le meme nom, donc publier une nouvelle image ne
# suffit pas — le site continue de servir l'ancienne (incident du 9 octobre
# 2026 : 3 jours de retard alors que 7 images avaient ete publiees). Cette
# valeur change a chaque publication : le rendu change, ArgoCD synchronise et
# le pod redemarre en tirant le nouveau « latest ».
#
# Verifier ce qui tourne :
#   kubectl -n mpacer get deploy mpacer \
#     -o jsonpath='{.spec.template.metadata.annotations}'
#   kubectl -n mpacer get pod -l app.kubernetes.io/instance=mpacer \
#     -o jsonpath='{.items[0].status.containerStatuses[0].imageID}'
# Empreinte de l'image publiee pour le commit courant de main (88fa0da,
# construite le 9 octobre 2026 a 10:27 UTC) : c'est exactement l'image que porte
# le tag « latest » sur ghcr.io. Resolue apres un conflit de fusion dont les deux
# cotes (sha-708d210 et sha-3190d2b) etaient perimes.
podAnnotations:
  mpacer.zacharie.org/image-publiee: "sha-7ef88a7@sha256:5d8296f972530c40e32f634f993e24d1410df36e093de31e37e7ae3294d67fcc"

imagePullSecrets:
  - name: regcred

# Noeuds amd64 (vm15x/vm16x) : le cluster compte aussi des noeuds arm64 (pi20x).
nodeSelector:
  kubernetes.io/arch: amd64

service:
  port: 8080

# Secrets geres dans Vault et synchronises par l'External Secrets Operator :
#   vault kv put apps/mpacer \
#     MPACER_SESSION_SECRET="$(openssl rand -base64 48)" \
#     MPACER_GOOGLE_CLIENT_ID="....apps.googleusercontent.com" \
#     MPACER_GOOGLE_CLIENT_SECRET="GOCSPX-...."
externalSecrets:
  enabled: true
  # Le ClusterSecretStore 'vault-apps' pointe sur le MONTAGE Vault 'apps/'
  # (verifie sur jo3) : la cle est donc simplement le chemin dans ce montage.
  secretStore: vault-apps
  vaultPath: mpacer
  secretName: mpacer-secrets
  keys:
    # Deezer par cookie arl : a renseigner ICI seulement apres avoir scelle
    # MPACER_DEEZER_ARL dans Vault (un remoteRef absent fait echouer l'ESO).
    #   vault kv patch apps/mpacer MPACER_DEEZER_ARL="<cookie arl>"
    # puis : keys.deezerArl: MPACER_DEEZER_ARL
    deezerArl: ""
    # Identifiants de l'instance Deemix (authentification basique Traefik) :
    # meme regle, a renseigner apres les avoir scelles dans Vault.
    #   vault kv patch apps/mpacer MPACER_DEEMIX_USER="joseph" \
    #     MPACER_DEEMIX_PASSWORD="<mot de passe>"
    # puis : keys.deemixUser: MPACER_DEEMIX_USER
    #        keys.deemixPassword: MPACER_DEEMIX_PASSWORD
    deemixUser: ""
    deemixPassword: ""

# Le chart ne cree pas de Secret : il consomme celui produit par ESO
auth:
  existingSecret: mpacer-secrets

config:
  environment: production
  # Depot des MP3 depuis /music (docs/16) : chemin sur le volume persistant.
  mediaDir: /data/media
  # Doit correspondre a l'URL de redirection declaree dans la console Google :
  #   https://mpacer.p.zacharie.org/auth/google/callback
  publicUrl: https://mpacer.p.zacharie.org
  cookieSecure: true
  devAuth: false
  # La console Google autorise https://mpacer.p.zacharie.org/auth/google/callback
  # (verifie le 6 octobre 2026) : c'est le chemin par defaut de l'application.
  googleRedirectUri: ""
  # Deezer (optionnel) : renseigner apres avoir scelle MPACER_DEEZER_APP_ID et
  # MPACER_DEEZER_APP_SECRET dans Vault (deploy/GITOPS-ET-SECRETS.md section 2)
  # et declare https://mpacer.p.zacharie.org/auth/deezer/callback dans
  # "Application Domains" sur https://developers.deezer.com/myapps.
  deezerRedirectUri: ""
  # Deezer par cookie arl (voie recommandee) : le cookie va dans Vault
  # (MPACER_DEEZER_ARL), pas ici. Laissez vide pour utiliser l'instance Deemix
  # par defaut (https://deemix.p.zacharie.org) dans les liens MP3 de /music.
  deemixUrl: ""

# PostgreSQL gere par l'operateur CloudNativePG (present sur jo3 : cnpg-system)
postgresql:
  enabled: true
  mode: cnpg
  instances: 1
  database: mpacer
  username: mpacer
  storage:
    size: 2Gi
    # Conserve le volume si le cluster est supprime (donnees de sante personnelles)
    storageClass: local-path-retain
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi
  nodeSelector:
    kubernetes.io/arch: amd64

# Volume applicatif : depot Wi-Fi des MP3 (docs/16). Assez grand pour le quota
# audio par compte (4 Go) plus une marge ; les fichiers partent des qu'ils sont
# acquittes par l'appareil.
persistence:
  enabled: true
  storageClass: local-path-retain
  size: 6Gi
  mountPath: /data

# Avec PostgreSQL, l'application est sans etat : mise a jour sans coupure
strategy:
  type: RollingUpdate

ingress:
  enabled: true
  className: traefik
  host: mpacer.p.zacharie.org

# Passer a true pour exposer le service publiquement (montre hors du domicile).
cloudflareIngress:
  enabled: false
  className: cloudflare-tunnel
  host: mpacer.zacharie.org

certificate:
  enabled: true
  issuerRef:
    name: letsencrypt-production-dns
    kind: ClusterIssuer

resources:
  requests:
    cpu: 25m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

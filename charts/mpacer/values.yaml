# Valeurs par defaut du chart M-pacer.
# Pour le cluster jo3, utiliser values-jo3.yaml (voir deploy/README.md).

replicaCount: 1

image:
  repository: ghcr.io/jzacharie/mpacer
  # Vide => appVersion du chart
  tag: ""
  pullPolicy: IfNotPresent

# Le cluster jo3 dispose d'un secret regcred par namespace (ghcr.io)
imagePullSecrets:
  - name: regcred

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: ""
  annotations: {}

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 8080

# Configuration non sensible (ConfigMap)
config:
  environment: production
  publicUrl: https://mpacer.p.zacharie.org
  cookieSecure: true
  # A NE JAMAIS activer en production : connexion de test sans Google
  devAuth: false
  # URI de redirection OAuth enregistree dans la console Google.
  # Vide => <publicUrl>/auth/google/callback. A renseigner si le client OAuth
  # utilise un autre chemin (le service sert alors le callback a ce chemin).
  googleRedirectUri: ""
  # URI de redirection OAuth Deezer, declaree dans "Application Domains" sur
  # https://developers.deezer.com/myapps. Vide => <publicUrl>/auth/deezer/callback
  # (inutile avec un cookie arl : la source est deja accessible)
  deezerRedirectUri: ""
  # Instance Deemix utilisee pour telecharger les MP3 depuis un navigateur.
  # Vide => https://deemix.p.zacharie.org. La page /music construit ses liens sur
  # les routes de l'interface Deemix (#/playlist/<id>, #/track/<id>).
  deemixUrl: ""
  # Suivi en direct : le service s'abonne a ce broker MQTT et publie la page
  # /live avec la position de la montre pendant la seance. Vide => fonctionnalite
  # desactivee (aucune connexion ouverte, page /live explicative).
  mqttUrl: ""
  # Filtre souscrit : "mpacer/live/+" couvre "mpacer/live/<montre>".
  mqttTopic: "mpacer/live/+"
  # Identifiant du broker (le mot de passe va dans auth.mqttPassword).
  mqttUsername: ""
  # Depot des MP3 depuis la page /music (docs/16). Renseigner un chemin SUR le
  # volume persistant (ex. /data/media) active la zone de depot ; vide => aucun
  # octet audio sur le serveur, comme avant. Les fichiers sont supprimes des que
  # la montre ou le telephone les a acquittes.
  mediaDir: ""
  # Plafond d'un fichier depose (octets) ; vide => 200 Mo (defaut du service).
  mediaMaxFileBytes: ""
  # Quota d'audio par compte (octets) ; vide => 4 Go (defaut du service).
  mediaQuotaBytes: ""
  rustLog: "info,mpacer_api=info,tower_http=warn"

auth:
  # Reutiliser un secret existant (cree hors chart : External Secrets, sceau, etc.)
  existingSecret: ""
  # Sinon, renseigner les identifiants Google (Console Google Cloud -> OAuth 2.0)
  googleClientId: ""
  googleClientSecret: ""
  # OAuth Deezer (optionnel) : identifiant d'application et cle secrete
  # (https://developers.deezer.com/myapps). Sans les deux, la source Deezer est
  # annoncee "non configuree" et la page /music reste utilisable.
  deezerAppId: ""
  deezerAppSecret: ""
  # Cookie "arl" du compte Deezer : la voie recommandee (aucune application
  # developpeur, playlists privees lisibles). Le copier depuis le navigateur
  # (deezer.com > Application > Cookies > arl). Prioritaire sur l'OAuth.
  deezerArl: ""
  # Authentification HTTP basique de l'instance Deemix (Traefik). Avec le cookie
  # arl ci-dessus, /music peut ENVOYER les playlists dans la file de Deemix
  # (bouton « Telecharger dans Deemix ») et afficher la progression. Sans ces
  # deux valeurs, la page se contente des liens vers Deemix.
  deemixUser: ""
  deemixPassword: ""
  # Mot de passe du broker MQTT du suivi en direct (optionnel). Stocke dans le
  # Secret, jamais dans le ConfigMap.
  mqttPassword: ""
  # Laissez vide : un secret de session est genere puis conserve entre les upgrades
  sessionSecret: ""

# Base de donnees. Par defaut : un cluster PostgreSQL CloudNativePG dedie,
# cree dans ce namespace (operateur cnpg 1.30 present sur jo3).
postgresql:
  enabled: true
  # cnpg = cluster gere par l'operateur ; external = serveur PostgreSQL existant
  mode: cnpg
  # Vide => <fullname>-pg
  name: ""
  # 1 instance suffit pour un usage personnel ; passer a 3 pour du HA
  instances: 1
  imageName: ""
  database: mpacer
  username: mpacer
  storage:
    size: 2Gi
    storageClass: local-path-retain
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi
  nodeSelector: {}
  # Sauvegardes continues vers un stockage objet compatible S3 (optionnel)
  backup:
    enabled: false
    destinationPath: ""
    endpointURL: ""
    credentialsSecret: ""
    schedule: "0 30 2 * * *"
  # Serveur existant (mode external)
  external:
    host: ""
    port: 5432
    database: mpacer
    username: mpacer
    # Secret contenant la cle "password" (et "host"/"port" si besoin)
    existingSecret: ""
    sslmode: require

# Volume local du pod applicatif : plus necessaire avec PostgreSQL,
# conserve pour un eventuel cache ou journal de support.
# Secrets synchronises depuis HashiCorp Vault par l'External Secrets Operator
# (present sur jo3). Si active, le chart ne cree plus son propre Secret : il
# consomme celui produit par ESO (auth.existingSecret doit pointer dessus).
externalSecrets:
  enabled: false
  secretStore: vault-apps
  refreshInterval: 1h
  # Chemin dans le montage Vault du store (sans prefixe "data/").
  # Exemple jo3 : le store 'vault-apps' monte 'apps/', donc vaultPath = mpacer
  # pour lire apps/data/mpacer.
  vaultPath: mpacer
  secretName: mpacer-secrets
  keys:
    sessionSecret: MPACER_SESSION_SECRET
    googleClientId: MPACER_GOOGLE_CLIENT_ID
    googleClientSecret: MPACER_GOOGLE_CLIENT_SECRET
    # Idem pour Deezer : vides tant que MPACER_DEEZER_APP_ID et
    # MPACER_DEEZER_APP_SECRET ne sont pas scelles dans Vault.
    deezerAppId: ""
    deezerAppSecret: ""
    # Idem pour le cookie arl Deezer (MPACER_DEEZER_ARL) : vide tant qu'il n'est
    # pas scelle dans Vault.
    deezerArl: ""
    # Idem pour les identifiants de l'instance Deemix (MPACER_DEEMIX_USER et
    # MPACER_DEEMIX_PASSWORD) : vides tant qu'ils ne sont pas scelles dans Vault.
    deemixUser: ""
    deemixPassword: ""
    # Idem pour le mot de passe du broker MQTT du suivi en direct (docs/10) :
    # vide tant que MPACER_MQTT_PASSWORD n'est pas scelle dans Vault.
    mqttPassword: ""
  # NB : le cluster jo3 provisionne deja 'regcred' (et 'tls-zacharie-org') dans chaque
  # namespace via ses propres ExternalSecrets. On ne les recree donc pas ici, pour
  # eviter un conflit de propriete sur un secret existant.

# Volume applicatif : necessaire seulement pour le depot Wi-Fi des MP3
# (config.mediaDir). Sans lui, la musique est copiee sur la montre par USB.
# Prevoir la taille du quota audio (4 Go par defaut) plus une marge.
persistence:
  enabled: false
  storageClass: local-path
  accessMode: ReadWriteOnce
  size: 5Gi
  mountPath: /data
  annotations: {}

ingress:
  enabled: true
  className: traefik
  annotations:
    kubernetes.io/ingress.class: traefik
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
  host: mpacer.p.zacharie.org
  path: /
  pathType: Prefix
  tls:
    enabled: true
    # Vide => <fullname>-tls (voir certificate ci-dessous)
    secretName: ""

# Acces depuis Internet (indispensable pour que la montre synchronise hors du domicile)
cloudflareIngress:
  enabled: false
  className: cloudflare-tunnel
  host: mpacer.zacharie.org
  annotations: {}

# Certificat TLS gere par cert-manager (ClusterIssuer DNS Cloudflare sur jo3)
certificate:
  enabled: true
  issuerRef:
    name: letsencrypt-production-dns
    kind: ClusterIssuer
  # Vide => <fullname>-tls
  secretName: ""
  # Vide => ingress.host + cloudflareIngress.host
  dnsNames: []

resources:
  requests:
    cpu: 25m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

livenessProbe:
  enabled: true
  path: /healthz
  initialDelaySeconds: 5
  periodSeconds: 30
  timeoutSeconds: 3
  failureThreshold: 3

readinessProbe:
  enabled: true
  path: /readyz
  initialDelaySeconds: 3
  periodSeconds: 15
  timeoutSeconds: 3
  failureThreshold: 3

# L'application ne conserve aucun etat local : la mise a jour peut se faire
# sans coupure (PostgreSQL est gere separement par l'operateur CNPG).
strategy:
  type: RollingUpdate

nodeSelector: {}
tolerations: []
affinity: {}

extraEnv: []
extraVolumes: []
extraVolumeMounts: []

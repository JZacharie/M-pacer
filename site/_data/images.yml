- file: "dashboards/nouveau.png"
  title: "Création d'un tableau de bord"
  caption: "Nom, gabarit et cases à cocher — le constructeur fonctionne sans JavaScript."
  group: "Écrans web"
  alt: "Formulaire de création d'un tableau de bord avec la liste des widgets disponibles"


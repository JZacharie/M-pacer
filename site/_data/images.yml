# ---------------------------------------------------------------------------
# Images de la documentation, publiees depuis docs/images (voir
# site/assets/images). Ce fichier alimente la galerie interactive et les
# vignettes : une seule liste, donc aucune image oubliee.
#
# file    : chemin relatif a site/assets/images
# title   : titre affiche dans la legende et la visionneuse
# caption : une phrase de contexte
# group   : filtre de la galerie (Architecture, Écrans web, Logos)
#
# Les valeurs sont entre guillemets : plusieurs contiennent « : » ou « — », que
# YAML interpreterait sinon comme un nouveau couple cle/valeur.
# ---------------------------------------------------------------------------

- file: "architecture-mpacer.jpg"
